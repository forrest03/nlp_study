<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静夜思 - 古诗卡</title>
<style>
  :root {
    --bg: #f7f2ea;
    --card: #fffdf9;
    --ink: #2b2620;
    --muted: #8a8172;
    --accent: #9a3412;
    --accent-soft: #fbeee2;
    --border: #e8dfd0;
    --shadow: 0 10px 30px rgba(60, 45, 20, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .header {
    padding: 32px 36px 24px;
    background: linear-gradient(135deg, #7c2d12 0%, var(--accent) 100%);
    color: #fff;
  }
  .title {
    margin: 0;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 44px;
    font-weight: 700;
  }
  .meta {
    margin-top: 8px;
    font-size: 17px;
    opacity: 0.92;
  }
  .grade-tag {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 10px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    font-size: 13px;
  }
  .body { padding: 28px 36px 36px; }
  .poem {
    margin: 4px 0 0;
    padding: 22px 16px;
    background: var(--accent-soft);
    border-radius: 12px;
    text-align: center;
  }
  .poem .line {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 26px;
    line-height: 1.9;
    letter-spacing: 6px;
  }
  h2 {
    margin: 28px 0 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .notes .note {
    padding: 8px 0;
    font-size: 16px;
    line-height: 1.6;
    border-bottom: 1px dashed var(--border);
  }
  .notes .note:last-child { border-bottom: none; }
  .notes .word {
    color: var(--accent);
    font-weight: 600;
    margin-right: 4px;
  }
  .prose {
    padding: 14px 16px;
    background: #faf6ee;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.8;
  }
  .quiz { list-style: none; padding: 0; margin: 0; }
  .quiz li {
    padding: 12px 16px;
    margin-bottom: 10px;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .quiz .q {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 17px;
    line-height: 1.6;
    letter-spacing: 2px;
  }
  .quiz details { margin-top: 8px; }
  .quiz summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
  }
  .quiz .a {
    margin-top: 6px;
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
  }
  .footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 class="title">静夜思</h1>
      <div class="meta">唐 · 李白<span class="grade-tag">适合 二年级</span></div>
    </div>
    <div class="body">
      <div class="poem">
        <div class="line">床前明月光，</div>
        <div class="line">疑是地上霜。</div>
        <div class="line">举头望明月，</div>
        <div class="line">低头思故乡。</div>
      </div>

      <h2>注释</h2>
      <div class="notes">
        <div class="note"><span class="word">疑</span>：好像，仿佛</div>
        <div class="note"><span class="word">举头</span>：抬起头</div>
        <div class="note"><span class="word">思</span>：思念，想念</div>
      </div>

      <h2>译文</h2>
      <div class="prose">床前洒满了明亮的月光，好像铺上了一层白白的霜。抬起头望着天上的月亮，低下头思念起远方的家乡。</div>

      <h2>赏析</h2>
      <div class="prose">这首诗用眼前最常见的月光，写出了出门在外的人对家乡的想念。语言简单，感情真挚，是流传最广的思乡诗。</div>

      <h2>背诵自测</h2>
      <ul class="quiz">
        <li><div class="q">1. 床前明月＿</div><details><summary>看答案</summary><div class="a">光</div></details></li>
        <li><div class="q">2. 疑是地上＿</div><details><summary>看答案</summary><div class="a">霜</div></details></li>
        <li><div class="q">3. 低头思＿</div><details><summary>看答案</summary><div class="a">故乡</div></details></li>
      </ul>

      <div class="footer">古诗卡 · 一诗一卡，读背结合</div>
    </div>
  </div>
</body>
</html>
