[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-grpo-experiment"
version = "0.1.0"
description = "A reproducible GRPO experiment for improving mathematical reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate>=1.3",
  "datasets>=3.2",
  "peft>=0.15",
  "safetensors>=0.5",
  "torch>=2.4",
  "transformers>=4.51",
  "trl>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
qlora = ["bitsandbytes>=0.46"]

[project.scripts]
math-grpo-train = "math_grpo.train:main"
math-grpo-eval = "math_grpo.evaluate:main"
math-grpo-compare = "math_grpo.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
