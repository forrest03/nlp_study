[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-skill-harness"
version = "0.1.0"
description = "A minimal harness that progressively loads local agent skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-harness = "progressive_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
