<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Progressive Skills Harness</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --line: #243049;
    --text: #e8eefc;
    --muted: #8b9bb8;
    --l0: #38bdf8;
    --l1: #a78bfa;
    --l2: #34d399;
    --release: #fb7185;
    --accent: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "SF Mono", "JetBrains Mono", "PingFang SC", monospace;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2744, var(--bg));
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: baseline;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .wrap {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 16px;
    padding: 16px;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }
  .panel {
    background: color-mix(in srgb, var(--panel) 92%, black);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    min-height: 420px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    margin: 0;
    padding: 12px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #log, #side {
    padding: 12px 14px;
    overflow: auto;
    flex: 1;
    font-size: 13px;
    line-height: 1.55;
  }
  .bubble {
    margin: 0 0 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #0f172a;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { border-color: #334155; }
  .bubble.final { border-color: var(--accent); }
  .bubble.tool { border-color: #3b4d6b; color: #cbd5e1; font-size: 12px; }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    margin-right: 6px;
  }
  .L0 { background: color-mix(in srgb, var(--l0) 25%, transparent); color: var(--l0); }
  .L1 { background: color-mix(in srgb, var(--l1) 25%, transparent); color: var(--l1); }
  .L2 { background: color-mix(in srgb, var(--l2) 25%, transparent); color: var(--l2); }
  .release { background: color-mix(in srgb, var(--release) 25%, transparent); color: var(--release); }
  .meters {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .meter {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    background: #0f172a;
  }
  .meter .n { font-size: 20px; color: var(--accent); }
  .meter .l { color: var(--muted); font-size: 11px; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  #composer input {
    flex: 1;
    background: #0f172a;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
  }
  #composer button {
    background: var(--accent);
    color: #111;
    border: 0;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
  .examples button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  #index { white-space: pre-wrap; color: #cbd5e1; font-size: 12px; }
  .event-list { margin: 0; padding-left: 18px; color: #cbd5e1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Progressive Skills Harness</h1>
    <p>L0 索引常驻 → L1 按需激活 SKILL.md → L2 按需读 references → 完成后 release</p>
  </div>
  <div id="model" style="color:var(--muted);font-size:12px;">loading…</div>
</header>

<div class="wrap">
  <section class="panel">
    <h2>对话 / 执行轨迹</h2>
    <div class="examples">
      <button data-q="给我做张 resilient 的英语闪卡">闪卡</button>
      <button data-q="统计这段文字的字数：Harness Engineering 让 Agent 在约束机制里稳定交付。">文本统计</button>
      <button data-q="画一个简单的三层 Web 架构图：浏览器、API、数据库">架构图</button>
    </div>
    <div id="log"></div>
    <form id="composer">
      <input id="q" placeholder="输入任务，观察 Skill 如何被渐进加载…" autocomplete="off" />
      <button id="send" type="submit">运行</button>
    </form>
  </section>

  <section class="panel">
    <h2>Context 仪表盘</h2>
    <div id="side">
      <div class="meters">
        <div class="meter"><div class="n" id="m-current">0</div><div class="l">当前 Skill tokens</div></div>
        <div class="meter"><div class="n" id="m-full">0</div><div class="l">全量加载 tokens</div></div>
        <div class="meter"><div class="n" id="m-saved">0</div><div class="l">节省 tokens</div></div>
        <div class="meter"><div class="n" id="m-active">—</div><div class="l">Active Skills</div></div>
      </div>
      <h3 style="font-size:12px;color:var(--muted);">加载事件</h3>
      <ul class="event-list" id="events"></ul>
      <h3 style="font-size:12px;color:var(--muted);margin-top:16px;">L0 索引 SKILLS.md</h3>
      <pre id="index"></pre>
    </div>
  </section>
</div>

<script>
const logEl = document.getElementById('log');
const eventsEl = document.getElementById('events');
const sendBtn = document.getElementById('send');
const qInput = document.getElementById('q');

function addBubble(text, cls='') {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateMeters(snap) {
  if (!snap) return;
  document.getElementById('m-current').textContent = snap.current_tokens ?? 0;
  document.getElementById('m-full').textContent = snap.full_load_tokens ?? 0;
  document.getElementById('m-saved').textContent = snap.saved_tokens ?? 0;
  document.getElementById('m-active').textContent = (snap.active_skills || []).join(', ') || '—';
  eventsEl.innerHTML = '';
  (snap.events || []).forEach(e => {
    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'tag ' + e.level;
    tag.textContent = e.level;
    li.appendChild(tag);
    li.appendChild(document.createTextNode(`${e.skill} ${e.path || ''} (+${e.tokens}t) ${e.detail}`));
    eventsEl.appendChild(li);
  });
}

async function boot() {
  const res = await fetch('/api/skills');
  const data = await res.json();
  document.getElementById('model').textContent =
    `${data.model.display} · ${data.model.model}`;
  document.getElementById('index').textContent = data.index;
}

async function runChat(message) {
  sendBtn.disabled = true;
  addBubble('你: ' + message, 'user');
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, max_steps: 12 }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const line = part.trim();
      if (!line.startsWith('data:')) continue;
      const ev = JSON.parse(line.slice(5).trim());
      handleEvent(ev);
    }
  }
  sendBtn.disabled = false;
}

function handleEvent(ev) {
  if (ev.type === 'session_start') {
    updateMeters(ev.token_snapshot);
    addBubble(`触发初筛: ${(ev.trigger_hints || []).join(', ') || '无'}\nL0≈${ev.token_snapshot.l0_tokens} / 全量≈${ev.token_snapshot.full_load_tokens}`, 'tool');
  } else if (ev.type === 'tool_call') {
    addBubble(`→ ${ev.tool}(${JSON.stringify(ev.arguments)})`, 'tool');
  } else if (ev.type === 'tool_result') {
    updateMeters(ev.token_snapshot);
    const r = ev.result || {};
    const brief = { ...r };
    delete brief.content;
    if (brief.content_preview) brief.content_preview = String(brief.content_preview).slice(0, 160);
    addBubble(`← ${ev.tool}: ${JSON.stringify(brief, null, 0).slice(0, 500)}`, 'tool');
  } else if (ev.type === 'final') {
    updateMeters(ev.token_snapshot);
    addBubble(ev.answer, 'final');
  } else if (ev.type === 'error') {
    addBubble('错误: ' + ev.message, 'final');
  }
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const msg = qInput.value.trim();
  if (!msg) return;
  qInput.value = '';
  runChat(msg);
});

document.querySelectorAll('.examples button').forEach(btn => {
  btn.addEventListener('click', () => {
    qInput.value = btn.dataset.q;
    qInput.focus();
  });
});

boot();
</script>
</body>
</html>
