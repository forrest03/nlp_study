<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness · Skill Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
color:#e0e0e0;height:100vh;display:flex;flex-direction:column;}
.header{padding:14px 20px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(0,229,255,0.2);
display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:16px;color:#00e5ff;}
.header .sub{font-size:11px;color:#888;margin-top:2px;}
.container{display:flex;flex:1;overflow:hidden;}
.sidebar{width:260px;background:rgba(0,0,0,0.3);border-right:1px solid rgba(255,255,255,0.08);
padding:14px 12px;overflow-y:auto;flex-shrink:0;}
.sidebar h3{font-size:12px;color:#00e5ff;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
.skill-card{margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;
overflow:hidden;background:rgba(255,255,255,0.03);transition:all 0.2s;}
.skill-header{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
transition:background 0.2s;}
.skill-header:hover{background:rgba(0,229,255,0.08);}
.skill-header .name{font-size:13px;color:#fff;font-weight:500;}
.skill-header .chevron{font-size:10px;color:#888;transition:transform 0.2s;}
.skill-card.open .skill-header .chevron{transform:rotate(90deg);}
.skill-body{max-height:0;overflow:hidden;transition:max-height 0.3s ease,padding 0.3s ease;}
.skill-card.open .skill-body{max-height:600px;overflow-y:auto;}
.skill-body-inner{padding:8px 12px 10px 12px;}
.skill-desc{font-size:12px;color:#aaa;line-height:1.5;margin-bottom:6px;}
.skill-steps-title,.skill-params-title{font-size:11px;color:#00e5ff;margin:6px 0 3px;text-transform:uppercase;letter-spacing:0.5px;}
.skill-steps{font-size:11px;color:#999;}
.skill-steps div{padding:2px 0;}
.skill-steps .step-title{color:#00e5ff;margin-right:4px;}
.skill-params{font-size:11px;color:#888;}
.skill-params div{padding:2px 0;}
.skill-params code{background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:3px;color:#ffcc00;font-size:11px;font-family:Consolas,monospace;}
.chat-area{flex:1;display:flex;flex-direction:column;max-width:860px;margin:0 auto;width:100%;}
.chat-messages{flex:1;padding:20px;overflow-y:auto;}
.msg{margin-bottom:14px;display:flex;gap:10px;}
.msg .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0;}
.msg.user .avatar{background:#00e5ff;color:#000;}
.msg.assistant .avatar{background:rgba(255,255,255,0.2);color:#fff;}
.msg .content{flex:1;max-width:85%;}
.msg.user .bubble{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.3);
padding:10px 14px;border-radius:8px;border-top-right-radius:2px;}
.msg.assistant .bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
padding:10px 14px;border-radius:8px;border-top-left-radius:2px;}
.bubble{white-space:pre-wrap;font-size:13px;line-height:1.7;}
.bubble a{color:#00e5ff;text-decoration:underline;word-break:break-all;}
.bubble a:hover{color:#fff;}
.bubble code{background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:3px;color:#ffcc00;
font-family:Consolas,monospace;font-size:12px;}
.bubble pre{background:rgba(0,0,0,0.4);padding:10px;border-radius:6px;overflow-x:auto;margin:6px 0;}
.bubble pre code{background:none;color:#b5cea8;}
.tool-indicator{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap;}
.tool-chip{display:inline-flex;align-items:center;gap:3px;background:rgba(0,229,255,0.12);
border:1px solid rgba(0,229,255,0.25);color:#00e5ff;padding:2px 8px;border-radius:10px;font-size:11px;}
.tool-chip .dot{width:5px;height:5px;border-radius:50%;background:#00e5ff;}
.tool-chip .dot.done{background:#4ade80;}
.tool-chip .dot.fail{background:#f87171;}
.tool-chip .dot.timeout{background:#fbbf24;}
.skill-badge{display:inline-block;background:rgba(255,200,0,0.12);border:1px solid rgba(255,200,0,0.3);
color:#fbbf24;padding:1px 6px;border-radius:4px;font-size:10px;margin-left:6px;}
.chat-input{padding:12px 20px;background:rgba(0,0,0,0.3);border-top:1px solid rgba(255,255,255,0.08);
display:flex;gap:10px;align-items:flex-end;}
.input-wrapper{flex:1;position:relative;}
textarea{width:100%;min-height:40px;max-height:120px;padding:10px 12px;
background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
border-radius:8px;color:#fff;font-size:13px;resize:vertical;outline:none;
font-family:inherit;}
textarea:focus{border-color:#00e5ff;}
.send-btn{background:#00e5ff;color:#000;border:none;padding:10px 22px;border-radius:8px;
font-size:13px;font-weight:bold;cursor:pointer;transition:all 0.2s;}
.send-btn:hover{background:#00b8d4;}
.send-btn:disabled{opacity:0.5;cursor:not-allowed;}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
color:#666;gap:14px;}
.empty-chat .icon{font-size:42px;}
.empty-chat .hint{font-size:14px;color:#aaa;}
.empty-chat .hint2{font-size:11px;color:#666;max-width:380px;text-align:center;line-height:1.5;}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,229,255,0.3);
border-top-color:#00e5ff;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);}
::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,229,255,0.4);}
</style>
</head>
<body>
<div class="header">
    <div>
        <h1>◆ Harness · Skill Agent</h1>
        <div class="sub">自动识别意图 · 调用工具 · 总结执行结果</div>
    </div>
</div>
<div class="container">
    <div class="sidebar">
        <h3>Available Skills</h3>
        <div id="skill-list">加载中...</div>
    </div>
    <div class="chat-area">
        <div class="chat-messages" id="messages">
            <div class="empty-chat" id="empty-hint">
                <div class="icon">🤖</div>
                <div class="hint">我是 Skill Agent，有什么可以帮你的？</div>
                <div class="hint2">直接用自然语言描述你的需求，我会自动识别并调用对应的工具完成任务。<br>例如："查询贵州茅台2026-07-24股票信息" 或 "做一个crazy的闪卡"</div>
            </div>
        </div>
        <div class="chat-input">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="描述你的需求...（Enter 发送，Shift+Enter 换行）"></textarea>
            </div>
            <button class="send-btn" id="send-btn">发送</button>
        </div>
    </div>
</div>

<script>
let messages = [];
let availableSkills = [];

async function loadSkills() {
    try {
        const resp = await fetch('/api/skills');
        const data = await resp.json();
        availableSkills = data.skills || [];
        renderSidebar();
    } catch(e) {
        document.getElementById('skill-list').innerHTML = '<div style="color:#f66;font-size:11px;">加载失败</div>';
    }
}

function renderSidebar() {
    const list = document.getElementById('skill-list');
    if (!availableSkills.length) {
        list.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;">暂无 Skill</div>';
        return;
    }
    list.innerHTML = availableSkills.map((s, idx) => {
        const desc = (s.description || '无描述').replace(/\s+/g, ' ').trim();
        const shortDesc = desc.length > 150 ? desc.substring(0, 150) + '...' : desc;
        let stepsHtml = '';
        if (s.steps && s.steps.length) {
            stepsHtml = '<div class="skill-steps-title">执行步骤：</div><div class="skill-steps">' + s.steps.map(st => 
                `<div><span class="step-title">Step ${st.step_num}:</span> ${st.title}</div>`
            ).join('') + '</div>';
        }
        let paramsHtml = '';
        if (s.parameters && Object.keys(s.parameters).length) {
            paramsHtml = '<div class="skill-params-title">参数：</div><div class="skill-params">' + 
                Object.entries(s.parameters).map(([k, v]) => {
                    const ex = v && v.example ? `（例：${v.example}）` : '';
                    return `<div><code>${k}</code>${ex}</div>`;
                }).join('') + '</div>';
        }
        return `
        <div class="skill-card" data-idx="${idx}">
            <div class="skill-header">
                <span class="name">${s.name}</span>
                <span class="chevron">▶</span>
            </div>
            <div class="skill-body"><div class="skill-body-inner">
                <div class="skill-desc">${shortDesc}</div>
                ${stepsHtml}
                ${paramsHtml}
            </div></div>
        </div>`;
    }).join('');

    list.querySelectorAll('.skill-card').forEach(card => {
        const header = card.querySelector('.skill-header');
        header.addEventListener('click', () => {
            card.classList.toggle('open');
        });
    });
}

function renderContent(text) {
    if (!text) return '';
    // Convert markdown-style links [text](url) to HTML
    let html = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // Convert bare /files/ paths to clickable links
    html = html.replace(/(^|\s)(\/files\/[^\s，,，。\)\]]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return html;
}

function addMsg(role, content, toolCalls, skillUsed) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    let toolHtml = '';
    if (toolCalls && toolCalls.length) {
        toolHtml = '<div class="tool-indicator">';
        toolCalls.forEach(tc => {
            const dotClass = tc.status === 'completed' ? 'done' :
                tc.status === 'failed' ? 'fail' :
                tc.status === 'timeout' ? 'timeout' : '';
            const icon = tc.status === 'completed' ? '✓' :
                tc.status === 'failed' ? '✗' :
                tc.status === 'timeout' ? '⏱' : '●';
            toolHtml += `<span class="tool-chip"><span class="dot ${dotClass}"></span>${icon} ${tc.tool_name} · ${tc.duration_ms}ms</span>`;
        });
        toolHtml += '</div>';
    }

    let skillHtml = '';
    if (skillUsed) {
        skillHtml = `<span class="skill-badge">✦ ${skillUsed}</span>`;
    }

    div.innerHTML = `
        <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
        <div class="content">
            ${toolHtml}
            ${skillHtml}
            <div class="bubble"></div>
        </div>
    `;
    const bubble = div.querySelector('.bubble');
    bubble.innerHTML = renderContent(content);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    document.getElementById('empty-hint').style.display = 'none';

    addMsg('user', text);
    input.value = '';

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg assistant';
    loadingDiv.innerHTML = '<div class="avatar">AI</div><div class="content"><div class="bubble"><span class="loading"></span></div></div>';
    document.getElementById('messages').appendChild(loadingDiv);

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_input: text,
                messages: messages.slice(-10)
            })
        });
        const data = await resp.json();
        loadingDiv.remove();

        messages.push({role:'user', content:text});
        messages.push({role:'assistant', content:data.reply});

        addMsg('assistant', data.reply, data.tool_calls, data.skill_used);
    } catch(e) {
        loadingDiv.remove();
        addMsg('assistant', '请求失败: ' + e.message);
    }
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

loadSkills();
</script>
</body>
</html>
