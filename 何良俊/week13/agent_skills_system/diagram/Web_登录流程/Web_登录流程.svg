<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1150">
  <defs>
    <!-- 字体样式 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
      }
    </style>

    <!-- 网格背景 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- 标准箭头（灰色） -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>

    <!-- 主色箭头（青色） -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>

    <!-- 成功箭头（绿色） -->
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>

    <!-- 警示箭头（玫红色） -->
    <marker id="arrow-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>

    <!-- 连接器箭头（橙色） -->
    <marker id="arrow-connector" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 区域/泳道边界 -->
  <!-- 客户端区域 -->
  <rect x="40" y="40" width="340" height="1060" rx="12" fill="rgba(8, 51, 68, 0.1)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="60" y="62" fill="#22d3ee" font-size="12" font-weight="600">客户端（浏览器）</text>

  <!-- 服务端区域 -->
  <rect x="560" y="40" width="340" height="1060" rx="12" fill="rgba(6, 78, 59, 0.1)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="580" y="62" fill="#34d399" font-size="12" font-weight="600">服务端（后端）</text>

  <!-- ==================== 连接线（箭头） ==================== -->

  <!-- 开始 -> 输入凭证 -->
  <line x1="200" y1="130" x2="200" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 输入凭证 -> 前端验证 -->
  <line x1="200" y1="230" x2="200" y2="300" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-primary)"/>

  <!-- 前端验证（失败）-> 输入凭证 -->
  <path d="M 130 340 L 60 340 L 60 205 L 120 205" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-alert)"/>
  <text x="50" y="210" fill="#fb7185" font-size="9" font-weight="500" text-anchor="end">格式错误</text>

  <!-- 前端验证（成功）-> 发送请求 -->
  <line x1="200" y1="380" x2="200" y2="560" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-primary)"/>

  <!-- 显示错误 -> 输入凭证 -->
  <path d="M 120 462 L 60 462 L 60 205 L 120 205" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-alert)"/>
  <text x="50" y="470" fill="#fb7185" font-size="9" font-weight="500" text-anchor="end">账号或密码错误</text>

  <!-- 发送请求 -> 接收请求 -->
  <line x1="280" y1="585" x2="620" y2="585" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-connector)"/>
  <text x="450" y="575" fill="#fb923c" font-size="9" font-weight="500" text-anchor="middle">POST /api/login</text>

  <!-- 接收请求 -> 校验凭证 -->
  <line x1="700" y1="610" x2="700" y2="640" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 校验凭证（失败）-> 返回错误 -->
  <path d="M 770 680 L 840 680 L 840 805 L 780 805" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-alert)"/>
  <text x="850" y="675" fill="#fb7185" font-size="9" font-weight="500" text-anchor="start">凭证不匹配</text>

  <!-- 返回错误 -> 显示错误 -->
  <path d="M 620 805 L 380 805 L 380 462 L 280 462" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-alert)"/>
  <text x="500" y="800" fill="#fb7185" font-size="9" font-weight="500" text-anchor="end">错误响应</text>

  <!-- 校验凭证（成功）-> 生成 Token -->
  <line x1="700" y1="720" x2="700" y2="780" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-success)"/>

  <!-- 生成 Token -> 返回 Token -->
  <line x1="700" y1="830" x2="700" y2="860" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-success)"/>

  <!-- 返回 Token -> 接收 Token -->
  <line x1="620" y1="885" x2="280" y2="885" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-success)"/>
  <text x="450" y="875" fill="#34d399" font-size="9" font-weight="500" text-anchor="middle">200 OK + JWT</text>

  <!-- 接收 Token -> 结束 -->
  <line x1="200" y1="910" x2="200" y2="1020" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 组件（遮罩 + 形状 + 文本） ==================== -->

  <!-- 1. 开始 -->
  <rect x="120" y="80" width="160" height="50" rx="25" fill="#0f172a"/>
  <rect x="120" y="80" width="160" height="50" rx="25" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="110" fill="white" font-size="12" font-weight="600" text-anchor="middle">开始</text>

  <!-- 2. 输入凭证 -->
  <rect x="120" y="180" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="120" y="180" width="160" height="50" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="206" fill="white" font-size="12" font-weight="600" text-anchor="middle">输入账号密码</text>
  <text x="200" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">点击登录按钮</text>

  <!-- 3. 前端验证 -->
  <polygon points="200,300 270,340 200,380 130,340" fill="#0f172a"/>
  <polygon points="200,300 270,340 200,380 130,340" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle">验证输入</text>
  <text x="200" y="358" fill="#94a3b8" font-size="9" text-anchor="middle">格式是否正确?</text>

  <!-- 4. 显示错误 -->
  <rect x="120" y="440" width="160" height="45" rx="6" fill="#0f172a"/>
  <rect x="120" y="440" width="160" height="45" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="200" y="466" fill="white" font-size="11" font-weight="600" text-anchor="middle">显示错误提示</text>

  <!-- 5. 发送请求 -->
  <rect x="120" y="560" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="120" y="560" width="160" height="50" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="200" y="586" fill="white" font-size="11" font-weight="600" text-anchor="middle">发送登录请求</text>
  <text x="200" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">加密传输</text>

  <!-- 6. 接收请求 -->
  <rect x="620" y="560" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="620" y="560" width="160" height="50" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="700" y="586" fill="white" font-size="11" font-weight="600" text-anchor="middle">接收登录请求</text>
  <text x="700" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">频率限制 / 验签</text>

  <!-- 7. 校验凭证 -->
  <polygon points="700,640 770,680 700,720 630,680" fill="#0f172a"/>
  <polygon points="700,640 770,680 700,720 630,680" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="700" y="685" fill="white" font-size="11" font-weight="600" text-anchor="middle">校验凭证</text>
  <text x="700" y="698" fill="#94a3b8" font-size="9" text-anchor="middle">账号密码 / 状态</text>

  <!-- 8. 生成 Token -->
  <rect x="620" y="780" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="620" y="780" width="160" height="50" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="806" fill="white" font-size="11" font-weight="600" text-anchor="middle">生成 JWT Token</text>
  <text x="700" y="820" fill="#94a3b8" font-size="9" text-anchor="middle">设置过期时间</text>

  <!-- 9. 返回错误 -->
  <rect x="620" y="780" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="620" y="780" width="160" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="700" y="806" fill="white" font-size="11" font-weight="600" text-anchor="middle">返回错误响应</text>
  <text x="700" y="820" fill="#94a3b8" font-size="9" text-anchor="middle">账号或密码错误</text>

  <!-- 10. 返回 Token -->
  <rect x="620" y="860" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="620" y="860" width="160" height="50" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="886" fill="white" font-size="11" font-weight="600" text-anchor="middle">返回 Token 给前端</text>
  <text x="700" y="900" fill="#94a3b8" font-size="9" text-anchor="middle">JWT Token</text>

  <!-- 11. 接收 Token -->
  <rect x="120" y="860" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="120" y="860" width="160" height="50" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="886" fill="white" font-size="11" font-weight="600" text-anchor="middle">接收并存储 Token</text>
  <text x="200" y="900" fill="#94a3b8" font-size="9" text-anchor="middle">localStorage / Cookie</text>

  <!-- 12. 结束 -->
  <rect x="120" y="1020" width="160" height="50" rx="25" fill="#0f172a"/>
  <rect x="120" y="1020" width="160" height="50" rx="25" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="1050" fill="white" font-size="12" font-weight="600" text-anchor="middle">登录成功</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="700" y="1060" width="210" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="715" y="1078" fill="#94a3b8" font-size="9" font-weight="500">图例</text>
  
  <rect x="715" y="1086" width="10" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="735" y="1096" fill="#94a3b8" font-size="9">用户操作 / 前端验证</text>

  <rect x="715" y="1102" width="10" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="735" y="1112" fill="#94a3b8" font-size="9">系统处理 / Token</text>

  <rect x="810" y="1086" width="10" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="830" y="1096" fill="#94a3b8" font-size="9">错误 / 失败路径</text>
</svg>